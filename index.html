<!DOCTYPE html>
<html>
    <head>
        <title>OfLocksley Creative</title>
    
        <meta name="description" content="The work of Robin OfLocksley Ricketts">
        <meta name="keywords" content="Photography, 3D Sculpting, Illustration, Web Design, Geelong, Victoria, Australia">
        <meta name="author" content="Robin Ricketts">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="Universal-Images\Logo\favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="Scripts\mainstyles.css">
         
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        
    </head>
    <body onload="injectDNA()">
        <div id="pageContainer">
            <div id="header">
                <div id="pageLogo">
                    <img src="Universal-Images\Logo\OfLocksley-web-Logo.svg">
                </div>
                <div id="pageTitle">  
                    <span>Page Title</span>              
                    <div id="searchBar" class="smooth">
                        <input type="text" placeholder="Search.." id="searchBarInput"><button type="submit" id="searchBtn"><i class="fa fa-search"></i></button>
                    </div>
                </div>
                <div id="mainMenu" class="smooth">
                    <div id="mainMenuList" class="smooth mainMenuRevealOnLoad">
                    </div>
                </div>
                <div id="menuIcon"  onclick="menuChange(this)"> 
                    <div class="bar1"></div>
                    <div class="bar2"></div>
                    <div class="bar3"></div>
                </div>
            </div>
            <div id="pageContent">

            </div>
            <div id="pageFooter"></div>
        </div>
        <script src="Scripts\dna.js"></script>
        <script src="Scripts\mainScript.js"></script>
        <!-- <script src="Scripts\modules\360ImageCycleJS.js"></script> -->
    </body>
</html>
